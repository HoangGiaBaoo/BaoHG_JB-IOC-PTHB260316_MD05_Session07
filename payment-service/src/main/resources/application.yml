server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: payment-service

  # Moi gia tri deu co fallback dang ${BIEN:gia-tri-mac-dinh}:
  # - Moi truong that: truyen DB_HOST/DB_NAME/DB_USERNAME/DB_PASSWORD qua bien moi truong.
  # - CI (test + bootJar): khong can dung PostgreSQL, vi unit test dung Mockito
  #   va bootJar chi dong goi file JAR, khong khoi dong ung dung.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickbite_payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

payment:
  max-amount: ${PAYMENT_MAX_AMOUNT:50000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
