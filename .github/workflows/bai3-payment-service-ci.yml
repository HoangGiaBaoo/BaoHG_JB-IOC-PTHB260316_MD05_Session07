name: Payment Service CI
on:
  push:
    branches:
      - main
    # Monorepo: chi chay khi payment-service hoac chinh workflow nay thay doi
    paths:
      - 'payment-service/**'
      - '.github/workflows/bai3-payment-service-ci.yml'

defaults:
  run:
    working-directory: payment-service

jobs:
  # ---------------- Giai doan 1: Unit Test ----------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # ---------------- Giai doan 2: Build JAR ----------------
  build:
    name: Build JAR
    needs: test            # chi chay khi job test thanh cong
    runs-on: ubuntu-latest # runner MOI, hoan toan doc lap voi runner cua job test
    steps:
      # Job Isolation: runner cua job build la mot may ao MOI, workspace rong.
      # -> Khong thay ma nguon da checkout o job test  => phai checkout lai
      #    (thu nghiem 1: "No such file or directory", workspace chi co . va ..)
      # -> Khong co JDK 21 da setup o job test         => phai setup-java lai
      #    (thu nghiem 2: JDK mac dinh 17 -> "error: release version 21 not supported")
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Jar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: payment-service-jar
          # Luu ca thu muc chua file JAR (bootJar -> build/libs/payment-service-0.0.1-SNAPSHOT.jar)
          path: payment-service/build/libs/
          retention-days: 7
