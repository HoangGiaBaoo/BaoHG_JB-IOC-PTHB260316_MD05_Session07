name: Payment Service CI
on:
  push:
    branches:
      - main
    # Monorepo: chi chay khi payment-service hoac chinh workflow nay thay doi
    paths:
      - 'payment-service/**'
      - '.github/workflows/bai3-payment-service-ci.yml'

defaults:
  run:
    working-directory: payment-service

jobs:
  # ---------------- Giai doan 1: Unit Test ----------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # ---------------- Giai doan 2: Build JAR ----------------
  build:
    name: Build JAR
    needs: test            # chi chay khi job test thanh cong
    runs-on: ubuntu-latest # runner MOI, hoan toan doc lap voi runner cua job test
    steps:
      # THU NGHIEM 1: bo qua checkout + setup-java de kiem chung Job Isolation
      - name: Xem workspace cua job build
        working-directory: .
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"

      - name: Build Jar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: payment-service-jar
          path: payment-service/build/libs/
          retention-days: 7
