name: Cart Service CI
on: [push]

# Repo nay chua ca 4 bai (monorepo), cart-service nam trong thu muc con
defaults:
  run:
    working-directory: cart-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Build with Gradle
        run: ./gradlew bootJar
